[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-saver"
version = "4.1.0"
description = "Dependency-free, measurement-honest, distributed token optimization and pure-pointer externalization for LLM agent infrastructure."
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Casey del Carpio Barton / GlacierEQ" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audit = ["tiktoken>=0.7"]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio",
]

[project.scripts]
token-saver = "token_saver_elite_cli:main"
token-saver-mcp = "mcp.server:main"
token-saver-sidecar = "mastermind_sidecar:main"
token-saver-gateway = "server.gateway:main"
token-saver-chatgpt-audit = "src.chatgpt_export_audit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint.per-file-ignores]
# Only legacy import-bootstrap files intentionally add repo paths before importing.
"tests/test_elite_core.py" = ["E402"]
"tests/test_pure_pointer.py" = ["E402"]
"tests/test_sovereign_bridge.py" = ["E402"]
"tests/test_unified_token_engine.py" = ["E402"]
"tests/test_work_amplification_manifest.py" = ["E402"]
"token_saver_elite_cli.py" = ["E402"]
