name: One-shot Ruff repair

on:
  push:
    branches:
      - fix/reusable-ci-ruff-20260813
    paths:
      - .github/workflows/ruff-autofix-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reusable-ci-ruff-20260813
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Repair fail-closed probe exception handling
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/operate.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"expected {label} not found")
              text = text.replace(old, new, 1)

          replace_once("from __future__ import annotations\nimport importlib\n", "from __future__ import annotations\n\nimport enum\nimport importlib\n", "import block")
          replace_once('        except Exception as e:\n            errors.append("%s: %s: %s" % (name, type(e).__name__, e))\n', '        except ImportError as exc:\n            errors.append(f"{name}: {type(exc).__name__}: {exc}")\n', "import exception")

          pattern = r'def _is_local_class\(mod, obj\) -> bool:\n    try:\n.*?    except Exception:\n        return False\n\n'
          replacement = 'def _is_local_class(mod, obj) -> bool:\n    mod_name = getattr(obj, "__module__", None)\n    if mod_name in {mod.__name__, getattr(mod, "__package__", None)}:\n        return True\n    if getattr(mod, obj.__name__, None) is not obj:\n        return False\n    return not (\n        mod_name\n        and (\n            mod_name.startswith("typing")\n            or mod_name in {"builtins", "collections", "pathlib", "json", "sys", "os"}\n        )\n    )\n\n'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("expected local class predicate not found")

          pattern = r'    try:\n        import enum\n        if isinstance\(value, enum\.Enum\):\n.*?    except Exception:\n        pass\n'
          replacement = '    if isinstance(value, enum.Enum):\n        # Bare enum from a field is weak; allow only when a status-like call returned it.\n        return called_name in {"status", "decide", "check", "verdict", "state"}\n'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("expected enum content predicate not found")

          pattern = r'        if inspect\.isawaitable\(result\):\n            try:\n                result\.close\(\)\n            except Exception:\n                pass\n            return None\n        return result\n    except SystemExit:\n        return None\n    except Exception:\n        return None\n'
          replacement = '        if inspect.isawaitable(result):\n            close = getattr(result, "close", None)\n            if callable(close):\n                close()\n            return None\n        return result\n    except SystemExit:\n        return None\n    except (AttributeError, KeyError, OSError, RuntimeError, TypeError, ValueError):\n        return None\n'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit("expected safe call probe not found")

          replace_once('value.startswith("<function ") or value.startswith("<class ")', 'value.startswith(("<function ", "<class "))', "startswith predicate")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply safe Ruff fixes and canonical formatting
        run: |
          ruff check . --fix
          ruff format .
          ruff check .
          ruff format --check .

      - name: Remove one-shot workflow and commit repairs
        shell: bash
        run: |
          git rm .github/workflows/ruff-autofix-once.yml
          git config user.name "GlacierEQ CI Repair"
          git config user.email "glacier.equilibrium@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): canonicalize Python quality gate"
          git push origin HEAD:fix/reusable-ci-ruff-20260813
