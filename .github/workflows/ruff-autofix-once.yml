name: One-shot Ruff repair

on:
  push:
    branches:
      - fix/reusable-ci-ruff-20260813
    paths:
      - .github/workflows/ruff-autofix-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reusable-ci-ruff-20260813
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Apply reviewed semantic repairs
        run: |
          python .github/ci_repair_once.py
          rm .github/ci_repair_once.py

      - name: Canonicalize and prove Ruff clean
        run: |
          ruff check . --fix
          ruff format .
          ruff check .
          ruff format --check .

      - name: Remove one-shot workflow and commit repairs
        shell: bash
        run: |
          git rm .github/workflows/ruff-autofix-once.yml
          git config user.name "GlacierEQ CI Repair"
          git config user.email "glacier.equilibrium@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): canonicalize Python quality gate"
          git push origin HEAD:fix/reusable-ci-ruff-20260813
