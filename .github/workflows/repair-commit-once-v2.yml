name: Commit reviewed Ruff repairs once

on:
  push:
    branches:
      - fix/reusable-ci-ruff-20260813
    paths:
      - .github/workflows/repair-commit-once-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reusable-ci-ruff-20260813
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Apply reviewed semantic repairs and safe automated fixes
        shell: bash
        run: |
          python .github/ci_repair_once.py
          rm .github/ci_repair_once.py
          ruff check . --fix || true
          ruff format .

      - name: Remove one-shot machinery
        run: |
          rm -f .github/workflows/ruff-autofix-once.yml
          rm -f .github/workflows/repair-commit-once-v2.yml

      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name "GlacierEQ CI Repair"
          git config user.email "glacier.equilibrium@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): apply reviewed Ruff repairs"
          git push origin HEAD:fix/reusable-ci-ruff-20260813
