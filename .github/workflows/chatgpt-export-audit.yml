name: ChatGPT Export Token Audit

on:
  pull_request:
    branches: [main]
    paths:
      - src/chatgpt_export_audit.py
      - tests/test_chatgpt_export_audit.py
      - pyproject.toml
      - .github/workflows/chatgpt-export-audit.yml
  push:
    branches: [main]
    paths:
      - src/chatgpt_export_audit.py
      - tests/test_chatgpt_export_audit.py
      - pyproject.toml
      - .github/workflows/chatgpt-export-audit.yml

permissions:
  contents: read

jobs:
  audit-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install auditor test dependencies
        run: python -m pip install 'pytest>=7.0'
      - name: Verify branch, privacy and telemetry boundaries
        run: python -m pytest -q tests/test_chatgpt_export_audit.py
      - name: Verify audit CLI executable
        run: python -m src.chatgpt_export_audit --text 'Audit local visible text'

  full-python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing package and optional auditor dependencies
        run: python -m pip install -e '.[dev,audit]'
      - name: Run original and new Python tests
        run: python -m pytest -q tests/
